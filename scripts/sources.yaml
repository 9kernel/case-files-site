# sources.yaml — fontes monitoradas pelo agente catalogador (etapa 1 do pipeline).
#
# O agente verifica periodicamente estas URLs; quando um documento novo ou
# atualizado aparece, dispara a EXTRAÇÃO (scripts/ingest.py) e abre PR com
# as mensagens em pending_review.
#
# REGRA: toda linha de /data deve rastrear até uma entrada aqui.
#
# Tipos:
#   documento_oficial  — peça primária pública (relatório, IPJ-A, decisão) com
#                        página/figura citáveis por mensagem
#   processo_publico   — procedimento judicial/policial público que reúne o
#                        material, peça primária ainda não localizada
#   reportagem         — veículo de imprensa que publicou trechos
#
# REGRA ABSOLUTA: nunca preencher processo/documento/pagina/url_oficial sem
# evidência localizada. Usar null e o nível de verificação compatível.
#
# CASO BANCO MASTER — mensagens do celular de Daniel Vorcaro
# (extração forense da PF de 18/11/2025, divulgadas por documentos e imprensa)

