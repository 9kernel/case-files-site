      levantado pelo ministro André Mendonça (01/09/2026) e cujo conteúdo foi
      revelado pelo R7. Base documental da conversa alexandre-moraes-daniel-
      vorcaro: 7 mensagens localizadas (fls. 49, 61, 127, 129, 141, 143 e 147;
      figuras 48, 60, 126, 128, 140, 142 e 146). Todas as mensagens da thread
      são trechos — a transcrição integral não foi divulgada.
