name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar JSONs de /data
    # ubuntu fixo (não -latest): migrações de label do runner mudam o ambiente
    # sem aviso — os checks de sincronia (git diff --exit-code) exigem reprodutibilidade
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # mesmo major do ambiente de desenvolvimento local
      - name: validate.mjs
        run: node scripts/validate.mjs data
      - name: test-validate.mjs (testa cada regra de rejeição)
        run: node scripts/test-validate.mjs
      - name: test-whatsnew.mjs (lote mais recente deve estar no selo "novo")
        run: node scripts/test-whatsnew.mjs
      - name: audit-public-provenance.mjs (publicidade por mensagem)
        run: node scripts/audit-public-provenance.mjs
      - name: check-email-leak.mjs (sem e-mail pessoal em arquivos publicados)
        run: node scripts/check-email-leak.mjs
      - name: build-network.mjs (grafo de conexões em sincronia com as threads)
        run: |
          node scripts/build-network.mjs
          git diff --exit-code data/network.json
      - name: build-search-index.mjs (índice de busca plena em sincronia com as threads)
        run: |
          node scripts/build-search-index.mjs
          git diff --exit-code data/search-index.json
      - name: build-whatsnew.mjs (mapa de inclusões recentes em sincronia com as threads)
        run: |
          node scripts/build-whatsnew.mjs
          git diff --exit-code data/whatsnew.json

  deploy:
    name: Publicar no GitHub Pages (sem build)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Upload do diretório raiz (o que está no repo é o que vai ao ar)
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
